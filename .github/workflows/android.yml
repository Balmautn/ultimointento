name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar archivos de Android
        run: flutter create --platforms=android --project-name claude_organizador --org com.claude.organizador .

      - name: Poner nombre a la app
        run: sed -i 's/android:label="[^"]*"/android:label="Claude Organizador"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: claude-organizador-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publicar APK en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Claude Organizador (build ${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
